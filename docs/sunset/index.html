<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunset & Silver Lake — curb.here</title>
<meta name="description" content="3D model of the Sunset Blvd & Silver Lake Blvd intersection, Los Angeles, built from OpenStreetMap.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfd8dc; font: 14px/1.35 system-ui, sans-serif; color: #1d2327; }
  canvas { display: block; touch-action: none; }
  #ui { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  h1 { font-size: 15px; margin: 0 8px 0 0; padding: 6px 10px; background: #fffd; border-radius: 6px; }
  button, select { font: inherit; padding: 6px 10px; border: 1px solid #0003; border-radius: 6px; background: #fff; cursor: pointer; }
  button[aria-pressed="true"] { background: #1d2327; color: #fff; }
  #help { position: fixed; left: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); padding: 6px 10px; background: #fffd; border-radius: 6px; max-width: min(60ch, calc(100% - 40px)); }
  #attr { position: fixed; right: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); padding: 4px 8px; background: #fffd; border-radius: 6px; font-size: 12px; }
  #attr a { color: inherit; }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { padding: 6px 10px; background: #1d2327e6; color: #fff; border-radius: 6px; font-size: 13px; }
  .toggles label { display: flex; gap: 5px; align-items: center; padding: 5px 9px; background: #fff; border: 1px solid #0003; border-radius: 6px; cursor: pointer; user-select: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 16px; }
  .label { font: 600 12px system-ui, sans-serif; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">Loading Sunset &amp; Silver Lake…</div>
<div id="ui">
  <h1>Sunset &amp; Silver Lake</h1>
  <button id="mode" aria-pressed="false" title="Toggle orbit / street view (V)">Street view</button>
  <select id="preset" aria-label="Jump to a spot">
    <option value="">Jump to…</option>
  </select>
  <span id="photo-toggles" class="toggles" hidden>
    <label title="Each photo alone, flat, in front of where it was taken"><input type="checkbox" id="ph-flat"> Field photos flat</label>
    <label title="Photos projected onto the model's surfaces; where they overlap, the first photo wins"><input type="checkbox" id="ph-mapped"> Field photos mapped</label>
    <span id="photo-list" class="toggles" title="Turn individual photos on or off. Lower numbers take precedence where photos overlap."></span>
  </span>
  <span id="photo-time" class="pill" hidden></span>
</div>
<div id="help"></div>
<div id="attr">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>, ODbL · some sizes guessed<span id="photo-credit" hidden></span></div>
<script type="module" src="./main.js?v=ee1424a3f6"></script>
</body>
</html>
